<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>电竞陪玩俱乐部集成平台架构</title>
<style>
:root{color-scheme:dark}
body{margin:0;padding:30px 20px 48px;background:#0b0f17;color:#e8eaf2;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;align-items:center}
.wrap{width:100%;max-width:1240px}

.panel{background:#10151f;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:10px;overflow-x:auto}
svg{display:block;width:100%;height:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:20px}
.card{border:1px solid rgba(255,255,255,.09);border-radius:12px;padding:16px 18px;background:rgba(255,255,255,.03)}
.card h2{font-size:14px;margin:0 0 8px}
.card ul{margin:0;padding-left:18px}
.card li{font-size:13px;line-height:1.7;color:#b7bfd0}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px}
.cyan{background:#22d3ee}.emerald{background:#34d399}.rose{background:#fb7185}
text{font-family:inherit}
</style>
</head>

<div class="cards">
<div class="card"><h2><span class="dot cyan"></span>双轨供给侧</h2><ul><li>陪玩俱乐部批量入驻，统一管理旗下陪玩师与排班</li><li>散户陪玩师个人认证入驻，按技能标签自主接单</li></ul></div>
<div class="card"><h2><span class="dot emerald"></span>交易闭环</h2><ul><li>玩家下单 → 中台智能派单 → IM 连麦开黑</li><li>计费结算中心统一分账，俱乐部与散户按规则提现</li></ul></div>
<div class="card"><h2><span class="dot rose"></span>合规与资金安全</h2><ul><li>实名认证 + 资质审核 + 反作弊风控前置到网关</li><li>资金经第三方支付通道分账，平台不直接触资金池</li></ul></div>
